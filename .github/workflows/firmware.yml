# Compila el firmware del orbe en la nube y, con una etiqueta v1.0.10 (por ejemplo), lo publica para que el orbe
# se actualice solo por Wi-Fi.
#
#   - Cada cambio que llega a «main»: compila y revisa que quepa (no publica nada).
#   - Etiqueta «v<versión>» (tiene que ser igual a FW_VERSION de firmware/main/version.h): además PUBLICA en el
#     repositorio público ruloccc/orbepet-firmware: mascota.bin + version.json (lo que lee el orbe) y una
#     «Release» con los archivos para grabar por cable.
#
# Para publicar hace falta el secreto ORBEPET_FIRMWARE_TOKEN (un token con permiso de escribir en orbepet-firmware).
# Sin él, la compilación igual queda como «artefacto» descargable de esta ejecución.
name: Compilar firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Hacer espacio en el disco (la imagen de ESP-IDF y sus componentes no caben si no)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null || true
          df -h / | tail -1

      - uses: actions/checkout@v4

      - name: Leer la versión (firmware/main/version.h)
        id: ver
        run: |
          V=$(sed -n 's/^#define FW_VERSION "\(.*\)".*/\1/p' firmware/main/version.h)
          N=$(sed -n 's/^#define FW_NOMBRE "\(.*\)".*/\1/p' firmware/main/version.h)
          [ -n "$V" ] || { echo "::error::no encontré FW_VERSION en version.h"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "nombre=$N" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$V" ]]; then
            echo "::error::la etiqueta $GITHUB_REF_NAME no coincide con FW_VERSION ($V) de version.h"; exit 1
          fi
          echo "### Versión $V — $N" >> "$GITHUB_STEP_SUMMARY"

      - name: Compilar con ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32s3
          path: firmware
          command: idf.py build && (idf.py size-components > build/tamanos.txt 2>&1 || true)

      - name: Revisar que quepa en la ranura más chica (ota_1)
        run: |
          T=$(stat -c %s firmware/build/mascota.bin)
          MAX=$((0x7A0000))
          echo "mascota.bin: $T bytes de $MAX ($(( T * 100 / MAX ))%)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; head -45 firmware/build/tamanos.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true; echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -60 firmware/build/tamanos.txt 2>/dev/null || true
          [ "$T" -le "$MAX" ] || { echo "::error::el programa ($T bytes) no cabe en ota_1 ($MAX bytes)"; exit 1; }

      - name: Juntar los archivos
        run: |
          mkdir -p salida
          sudo cp firmware/build/mascota.bin salida/
          sudo cp firmware/build/bootloader/bootloader.bin salida/
          sudo cp firmware/build/partition_table/partition-table.bin salida/
          sudo cp firmware/build/ota_data_initial.bin salida/ 2>/dev/null || true
          sudo cp firmware/build/flasher_args.json salida/ 2>/dev/null || true
          sudo chown -R "$(id -u)" salida
          S=$(sha256sum salida/mascota.bin | cut -d' ' -f1)
          T=$(stat -c %s salida/mascota.bin)
          printf '{\n  "version": "%s",\n  "nombre": "%s",\n  "tam": %s,\n  "sha256": "%s",\n  "fecha": "%s",\n  "commit": "%s"\n}\n' \
            "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.nombre }}" "$T" "$S" "$(date -u +%Y-%m-%dT%H:%MZ)" "${GITHUB_SHA::7}" > salida/version.json
          cat salida/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.ver.outputs.version }}
          path: salida/
          retention-days: 30

      - name: Publicar en ruloccc/orbepet-firmware
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.ORBEPET_FIRMWARE_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
          N: ${{ steps.ver.outputs.nombre }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::falta el secreto ORBEPET_FIRMWARE_TOKEN: no se publicó (el .bin quedó como artefacto)"; exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/ruloccc/orbepet-firmware.git" pub
          cp salida/mascota.bin salida/version.json pub/
          cd pub
          git config user.name "orbepet-ci"; git config user.email "ci@orbepet.invalid"
          git add mascota.bin version.json
          git commit -m "Versión $V — $N" || echo "sin cambios"
          git push origin HEAD:main
          cd ..
          GH_TOKEN="$TOKEN" gh release create "v$V" salida/* --repo ruloccc/orbepet-firmware --title "$V — $N" \
            --notes "Firmware $V ($N). El orbe la baja solo desde Ajustes → Versión → Actualizar. Para grabar por cable: bootloader.bin, partition-table.bin, ota_data_initial.bin y mascota.bin."
